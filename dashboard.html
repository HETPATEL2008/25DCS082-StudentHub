<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub — Student Dashboard</title>
</head>
<body>

  <header>
    <a href="index.html"><img src="logo.png" alt="StudentHub logo"></a>
    <h1>Student Dashboard</h1>
  </header>

  <div class="dashboard-layout">
    <nav aria-label="Dashboard navigation">
      <ul>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </nav>

    <main>
      <section aria-labelledby="welcome-heading">
        <h2 id="welcome-heading">Welcome back, [Student Name]</h2>
      </section>

      <section aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="visually-hidden">Quick stats</h2>
        <article>
          <h3>Courses enrolled</h3>
          <p>0</p>
        </article>
        <article>
          <h3>Upcoming events</h3>
          <p>0</p>
        </article>
        <article>
          <h3>Resources available</h3>
          <p>0</p>
        </article>
      </section>

      <section aria-labelledby="activity-heading">
        <h2 id="activity-heading">Recent Activity</h2>
        <p>No recent activity yet.</p>
      </section>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

</body>
</html>
