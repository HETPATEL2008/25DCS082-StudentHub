<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html"><img src="logo.png" alt="StudentHub logo"></a>
    <nav aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Login to StudentHub</h1>

    <section aria-labelledby="login-form-heading">
      <h2 id="login-form-heading" class="visually-hidden">Login form</h2>
      <form action="#" method="post">

        <div>
          <label for="identifier">Email or Roll Number</label>
          <input type="text" id="identifier" name="identifier" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
      </form>

      <p><a href="register.html">New here? Register</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

</body>
</html>
