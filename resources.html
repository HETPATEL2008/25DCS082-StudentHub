  <main>
    <h1>Study Resources</h1>

    <section aria-labelledby="search-heading">
      <h2 id="search-heading" class="visually-hidden">Search resources</h2>
      <form role="search" action="#" method="get">
        <label for="resource-search">Search resources</label>
        <input type="search" id="resource-search" name="q">

        <label for="subject-filter">Filter by subject</label>
        <select id="subject-filter" name="subject">
          <option value="">All subjects</option>
          <option value="cn">Computer Network</option>
          <option value="dsa">Data Structures and Algorithms</option>
          <option value="dbms">Database Management System</option>
          <option value="ml">Machine Learning</option>
          <option value="java">Object Oriented Programing with Java</option>
          <option value="os">Operating System</option>
          <option value="C++">Programming with C++</option>
        </select>

        <button type="submit">Search</button>
      </form>
    </section>

    <section aria-labelledby="resource-list-heading">
      <h2 id="resource-list-heading" class="visually-hidden">Resource list</h2>

      <article>
        <h3>Resource name — Subject</h3>
        <a href="#">Download</a>
      </article>

      <article>
        <h3>Resource name — Subject</h3>
        <a href="#">Download</a>
